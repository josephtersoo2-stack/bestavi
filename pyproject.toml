[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aviator-auto-stake-bot"
version = "0.1.0"
description = "Configurable, safety-first Aviator staking automation prototype"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["aviator_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
